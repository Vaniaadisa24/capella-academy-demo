<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capella Academy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="brand"><div class="logo">C</div><span id="brandName">Capella</span></div>
    <div class="navgroup">MATH CLASS</div>
    <div class="navitem" data-view="dashboard"><span class="ic">◧</span>Dashboard</div>
    <div class="navitem" data-view="murid"><span class="ic">◍</span>Murid</div>
    <div class="navitem" data-view="modul"><span class="ic">▤</span>Modul &amp; bank soal</div>
    <div class="navgroup">MATH YOUTUBE</div>
    <div class="navitem" data-view="yt"><span class="ic">▷</span>Pipeline</div>
    <div class="navgroup" style="margin-top:auto"></div>
    <div class="navitem" data-view="settings"><span class="ic">⚙</span>Pengaturan</div>
  </nav>

  <div id="main">
    <div class="topbar">
      <button class="iconbtn" id="toggleNav" title="Sembunyikan menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div style="flex:1"></div>
      <button class="btn sm" id="exportBtn">⭳ Export</button>
      <button class="btn sm" id="importBtn">⭱ Import</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/demo-seed.js"></script>
<script src="js/data.js"></script>
<script src="js/views.js"></script>
<script src="js/modals.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
